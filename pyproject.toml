[project]
name = "redfab-harness"
version = "0.0.0"
description = "Test harness for redfab: drives Yosys and a vanilla Minecraft server"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "yowasp-yosys==0.68.0.0.post1208",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["."]

# `./check` runs `ruff check harness tools`: undefined names, unused imports and
# variables, syntax errors. Style stays the author's.
[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["F", "E9"]
