<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redfab playground</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #15171a; --panel: #1e2126; --edge: #2e3238; --text: #e6e6e6; --dim: #9aa0a8;
    --accent: #e8552d; --ok: #58c26a; --bad: #e0574f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--edge); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .hint { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; min-height: 0; }
  #left { display: grid; grid-template-rows: auto 1fr auto 1fr; min-height: 0; border-right: 1px solid var(--edge); }
  #toolbar { display: flex; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
  button { background: #2b3038; color: var(--text); border: 1px solid #3a4049; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { background: #343a44; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  select { background: #2b3038; color: var(--text); border: 1px solid #3a4049; border-radius: 6px; padding: 6px; font: inherit; }
  #source { width: 100%; height: 100%; resize: none; border: 0; padding: 10px; background: #0f1113; color: #f0f0f0;
            font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 4; outline: none; }
  #status { padding: 6px 10px; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); color: var(--dim); min-height: 30px; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  #log { margin: 0; padding: 8px 10px; overflow: auto; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--dim); white-space: pre-wrap; }
  #right { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  #panel { display: flex; gap: 16px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--edge); flex-wrap: wrap; min-height: 48px; }
  .pins { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pins .label { color: var(--dim); font-size: 12px; margin-right: 4px; }
  .lever { padding: 4px 10px; border-radius: 6px; border: 1px solid #3a4049; background: #2b3038; }
  .lever[data-on="1"] { background: #5a2a1a; border-color: var(--accent); }
  .lamp { display: inline-flex; align-items: center; gap: 6px; }
  .lamp .bulb { width: 14px; height: 14px; border-radius: 50%; background: #3a2a1a; border: 1px solid #5a4a2a; }
  .lamp[data-lit="1"] .bulb { background: #ffd34d; box-shadow: 0 0 8px #ffd34d; border-color: #ffe08a; }
  #tick { color: var(--dim); font-variant-numeric: tabular-nums; margin-left: auto; }
  #view { position: relative; min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #view .help { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #left { border-right: 0; border-bottom: 1px solid var(--edge); } }
</style>
</head>
<body>
<header>
  <h1>redfab playground</h1>
  <span class="hint">SystemVerilog in, a redstone circuit out: simulated here with the game's own rules, or run live on the server.</span>
</header>
<main>
  <section id="left">
    <div id="toolbar">
      <select id="examples" aria-label="examples"></select>
      <button id="compile" class="primary">Compile</button>
      <button id="run" disabled>Pause</button>
      <button id="download" disabled title="the structure file, for /place template or Litematica">world.nbt</button>
      <button id="live" hidden title="build on the server and run it in the game">Run on the server</button>
      <button id="release" hidden title="give the plot back">Stop</button>
    </div>
    <textarea id="source" spellcheck="false" aria-label="SystemVerilog source"></textarea>
    <div id="status">Ready.</div>
    <pre id="log"></pre>
  </section>
  <section id="right">
    <div id="panel">
      <div class="pins" id="inputs"><span class="label">inputs</span></div>
      <div class="pins" id="outputs"><span class="label">outputs</span></div>
      <span id="tick"></span>
    </div>
    <div id="view"><div class="help">drag to orbit, scroll to zoom, click a lever to flip it</div></div>
  </section>
</main>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
